[project]
name = "diskless"
version = "0.1.0"
description = "PXE + iSCSI 기반 디스크리스 서버 시스템"
readme = "README.md"
authors = [
    { name = "Lee Ji-ho", email = "search5@mz.co.kr" }
]
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1",
    "markupsafe>=2.1",
    "bcrypt>=4.1",
    "twisted>=26.4.0",
    "klein>=24.8.0",
    "autobahn>=26.7.1",
    "itsdangerous>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-twisted>=1.14.3",
]

# rtslib-fb는 Linux + target_core_mod configfs가 있어야 import 가능하므로
# 개발 편의를 위해 platform 마커로 Linux 한정 의존성으로 분리한다.
[project.optional-dependencies]
linux = [
    "rtslib-fb>=2.1.74; sys_platform == 'linux'",
]

[project.scripts]
diskless-priv-helper = "diskless.priv_helper.server:main"
# DHCP(Standalone/Proxy)+TFTP+iSCSI 세션 오케스트레이션+관리 웹 UI를 Twisted
# reactor 하나로 묶은 통합 데몬. priv_helper만 별도 프로세스로 분리 유지(6.2).
diskless-bootd = "diskless.bootd.main:main"
diskless-create-admin = "diskless.cli.create_admin:main"

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"
